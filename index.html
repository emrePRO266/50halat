<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Halatlı Parkur 2D</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#09111f;color:#fff;font-family:system-ui,Arial;overflow:hidden;touch-action:none}
#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
.panel{position:fixed;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,430px);padding:24px;background:#101d31ee;border:1px solid #34506f;border-radius:20px;box-shadow:0 20px 70px #0009}
h1{margin:0 0 8px;font-size:28px}p{color:#bdcce0;line-height:1.45;margin:8px 0 18px}
input,button{width:100%;padding:13px 14px;border-radius:11px;border:1px solid #49617f;background:#0a1525;color:white;font-size:16px;margin-top:9px}
button{background:#2677e8;border:0;font-weight:700;cursor:pointer}button.secondary{background:#253750}button:disabled{opacity:.45}
.row{display:flex;gap:9px}.row>*{flex:1}.hidden{display:none!important}
#hud{position:fixed;z-index:3;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;gap:6px}
.pill{background:#101d31dd;border:1px solid #38516e;padding:9px 12px;border-radius:12px;font-size:13px}
#help{position:fixed;z-index:3;bottom:12px;left:12px;background:#101d31dd;padding:10px 13px;border-radius:12px;font-size:12px;color:#d8e5f6}
#mobile{position:fixed;z-index:4;inset:0;display:none;pointer-events:none}
.pad{position:absolute;bottom:24px;display:flex;gap:10px;pointer-events:auto}
#movePad{left:18px}#actionPad{right:18px}
.pad button{width:66px;height:66px;border-radius:18px;padding:0;margin:0;background:#2677e8dd;border:1px solid #ffffff66;font-size:24px;touch-action:none}
#jumpBtn{width:82px!important;font-size:14px!important}
#toast{position:fixed;z-index:8;top:70px;left:50%;transform:translateX(-50%);background:#152c49;padding:10px 16px;border-radius:12px;display:none}
@media(max-width:700px){#help{max-width:58vw;font-size:11px}.pill{font-size:11px;padding:8px}}
</style>
</head><body>
<div id="game"></div>
<section id="deviceSelect" class="panel"><h1>🎮 Nasıl oynayacaksın?</h1><p>2D yandan görünüşlü parkur. Cihazını seç.</p><button data-mode="tablet">📱 Tablet / Dokunmatik</button><button data-mode="computer" class="secondary">💻 Bilgisayar / Klavye</button><button data-mode="gamepad" class="secondary">🎮 Gamepad</button></section>
<div id="hud" class="hidden"><div class="pill" id="roomLabel">ODA</div><div class="pill" id="playersLabel">Oyuncu: 1/4</div><div class="pill" id="levelLabel">SEVİYE 1 / 100</div></div>
<div id="help" class="hidden">A/D veya ←/→: Hareket · SPACE: Zıpla · Halat: 6 birim</div>
<div id="mobile" class="hidden"><div class="pad" id="movePad"><button data-key="a">◀</button><button data-key="d">▶</button></div><div class="pad" id="actionPad"><button id="jumpBtn">ZIPLA</button></div></div>
<div id="toast"></div>
<section id="menu" class="panel hidden"><h1>🪢 Halatlı Parkur 2D</h1><p>Tek başına veya 2–4 kişilik grupla oyna. Arkadaşlarınla halatla bağlısın; 100 parkur seviyesi seni bekliyor.</p>
<input id="nickname" maxlength="20" placeholder="Oyuncu adın" value="Oyuncu">
<div class="row"><button id="groupBtn">👥 Grup</button><button id="soloBtn" class="secondary">🧍 Tek Kişi</button></div>
<div class="row hidden" id="groupActions"><button id="createBtn">Oda Oluştur</button><button id="joinBtn" class="secondary">Odaya Katıl</button></div>
<input id="roomCode" maxlength="6" placeholder="6 tek rakamlı oda kodu">
<div id="waiting" class="hidden"><p id="waitingText"></p><button id="startBtn">Oyunu Başlat</button><button id="copyBtn" class="secondary">Oda Kodunu Kopyala</button></div>
</section><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://greikwornaifopisuyze.supabase.co";
const SUPABASE_KEY="sb_publishable_kSKf7EpaNNdE1lxrDj5oAg_e-Jq83jw";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),$=id=>document.getElementById(id);
let playerId=crypto.randomUUID(),room=null,me=null,channel=null,others=new Map(),started=false,controlMode=null,playMode="group",currentLevel=1,lastSend=0,lastActivity=Date.now(),lastCleanup=0;
const MAX_ROPE=6,keys={},W=1000,H=600;
function toast(t){$("toast").textContent=t;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",2300)}
function code(){return Array.from({length:6},()=>String([1,3,5,7,9][Math.floor(Math.random()*5)])).join("")}
function chooseMode(m){playMode=m;$("groupActions").classList.toggle("hidden",m!=="group");if(m==="solo")startSolo()}
function showGame(){ $("menu").classList.add("hidden");$("hud").classList.remove("hidden");$("help").classList.remove("hidden");$("mobile").classList.toggle("hidden",controlMode!=="tablet");$("mobile").style.display=controlMode==="tablet"?"block":"none";}
function startSolo(){playerId=crypto.randomUUID();room=null;me={id:playerId,nickname:$("nickname").value.trim()||"Oyuncu",slot:0};others.clear();currentLevel=1;resetPlayer();showGame();$("roomLabel").textContent="TEK KİŞİ";$("playersLabel").textContent="Oyuncu: 1/1";$("levelLabel").textContent="SEVİYE 1 / 100";started=true;lastActivity=Date.now();toast("2D tek kişilik oyun başladı!")}
async function createRoom(){
 playerId=crypto.randomUUID();const nick=$("nickname").value.trim()||"Oyuncu",join_code=code();
 const {data:r,error}=await db.from("game_rooms").insert({join_code,host_id:playerId,max_players:4}).select().single();
 if(error){toast("Oda oluşturulamadı: "+error.message);return}room=r;
 const {data:p,error:pe}=await db.from("game_players").insert({id:playerId,room_id:r.id,nickname:nick,slot:0}).select().single();
 if(pe){toast("Oyuncu eklenemedi: "+pe.message);return}me=p;await enterRoom();
}
async function joinRoom(){
 playerId=crypto.randomUUID();const nick=$("nickname").value.trim()||"Oyuncu",c=$("roomCode").value.trim();
 if(!/^[13579]{6}$/.test(c)){toast("Oda kodu 6 tek rakamdan oluşmalı.");return}
 const {data:r,error}=await db.from("game_rooms").select("*").eq("join_code",c).eq("status","waiting").maybeSingle();
 if(error||!r){toast("Oda bulunamadı veya oyun başlamış.");return}
 const {data:ps,error:pe}=await db.from("game_players").select("*").eq("room_id",r.id).order("slot");
 if(pe){toast(pe.message);return}if(ps.length>=r.max_players){toast("Oda dolu.");return}
 const used=new Set(ps.map(x=>x.slot));let slot=0;while(used.has(slot))slot++;
 const {data:p,error:ie}=await db.from("game_players").insert({id:playerId,room_id:r.id,nickname:nick,slot}).select().single();
 if(ie){toast("Katılınamadı: "+ie.message);return}room=r;me=p;await enterRoom();
}
async function enterRoom(){
 $("menu").querySelectorAll("input,.row").forEach(x=>x.classList.add("hidden"));$("waiting").classList.remove("hidden");
 $("startBtn").classList.toggle("hidden",room.host_id!==playerId);showGame();$("roomLabel").textContent="ODA "+room.join_code;
 await refreshPlayers();subscribe();
}
async function refreshPlayers(){const {data}=await db.from("game_players").select("*").eq("room_id",room.id).order("slot");if(data){others.clear();data.forEach(p=>{if(p.id!==playerId)others.set(p.id,p)});$("playersLabel").textContent="Oyuncu: "+data.length+"/4";$("waitingText").textContent="Oda kodu: "+room.join_code+"\n"+data.map(p=>"• "+p.nickname+(p.id===playerId?" (Sen)":"")).join("\n")}}
function subscribe(){channel=db.channel("room-"+room.id).on("postgres_changes",{event:"*",schema:"public",table:"game_players",filter:"room_id=eq."+room.id},payload=>{if(payload.eventType==="DELETE"){others.delete(payload.old.id);return}if(payload.new.id!==playerId)others.set(payload.new.id,payload.new);$("playersLabel").textContent="Oyuncu: "+(others.size+1)+"/4"}).on("postgres_changes",{event:"UPDATE",schema:"public",table:"game_rooms",filter:"id=eq."+room.id},payload=>{room=payload.new;if(room.status==="running")beginGame()}).subscribe()}
$("createBtn").onclick=createRoom;$("joinBtn").onclick=joinRoom;$("groupBtn").onclick=()=>chooseMode("group");$("soloBtn").onclick=()=>chooseMode("solo");
$("copyBtn").onclick=()=>navigator.clipboard?.writeText(room.join_code).then(()=>toast("Oda kodu kopyalandı."));
$("startBtn").onclick=async()=>{const {data,error}=await db.from("game_players").select("id").eq("room_id",room.id);if(error||!data||data.length<2){toast("Grup oyunu için en az 2 oyuncu gerekli.");return}await db.from("game_rooms").update({status:"running"}).eq("id",room.id);beginGame()};
function beginGame(){started=true;currentLevel=1;resetPlayer();$("levelLabel").textContent="SEVİYE 1 / 100";$("menu").classList.add("hidden");toast("Parkur başladı! Takımını bırakma.")}
document.querySelectorAll("#deviceSelect [data-mode]").forEach(b=>b.onclick=()=>{controlMode=b.dataset.mode;$("deviceSelect").classList.add("hidden");$("menu").classList.remove("hidden");$("help").textContent=controlMode==="tablet"?"◀ ▶: Hareket · ZIPLA: Zıpla":"A/D veya ←/→: Hareket · SPACE: Zıpla"});
document.querySelectorAll("#mobile [data-key]").forEach(b=>{const k=b.dataset.key;b.addEventListener("pointerdown",e=>{e.preventDefault();keys[k]=true;lastActivity=Date.now()});["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});
$("jumpBtn").addEventListener("pointerdown",e=>{e.preventDefault();keys.jump=true;lastActivity=Date.now()});["pointerup","pointercancel","pointerleave"].forEach(ev=>$("jumpBtn").addEventListener(ev,()=>keys.jump=false));
window.addEventListener("keydown",e=>{const k=e.key.toLowerCase();keys[k]=true;if(k===" "||k.startsWith("arrow"))e.preventDefault();lastActivity=Date.now()});window.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
const canvas=document.createElement("canvas"),ctx=canvas.getContext("2d");$("game").appendChild(canvas);
let scale=1,cameraX=0,player={x:2,y:0,vx:0,vy:0,w:.72,h:1.45,ground:false},platforms=[],hazards=[],checkpoints=[];
function resetPlayer(){player.x=2;player.y=1;player.vx=0;player.vy=0;player.ground=false}
function buildWorld(){
 platforms=[{x:0,y:0,w:9,h:.7,cp:1}];hazards=[];checkpoints=[];
 for(let lv=0;lv<100;lv++){const base=10+lv*22,pattern=lv%4,ys=[1.5,2.1,1.4,2.5,1.7];
  const offsets=pattern===0?[0,4,8,13,18]:pattern===1?[0,4,9,13,18]:pattern===2?[0,5,9,14,18]:[0,4,10,14,18];
  offsets.forEach((off,i)=>{const x=base+off;const y=ys[(i+pattern)%ys.length]+lv*.025;platforms.push({x,y,w:i===4?5:3.6,h:.55,cp:i===4?lv+2:0});if(i<4)hazards.push({x:x+1.7,y:y+.8,w:.55,h:.8})});
  checkpoints.push({x:base+18,y:ys[(4+pattern)%ys.length]+lv*.025,level:lv+2});
 }
}
buildWorld();
const colors=["#3b82f6","#ef647c","#f5b942","#a78bfa"];
function resize(){const d=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*d;canvas.height=innerHeight*d;canvas.style.width=innerWidth+"px";canvas.style.height=innerHeight+"px";ctx.setTransform(d,0,0,d,0,0);scale=innerWidth/22}
addEventListener("resize",resize);resize();
function jump(){if(player.ground){player.vy=10.5;player.ground=false}}
function update(dt){
 if(!started)return;
 let dir=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);
 if(controlMode==="gamepad"){const gp=Array.from(navigator.getGamepads?.()||[]).find(Boolean);if(gp){dir=Math.abs(gp.axes[0])>.2?gp.axes[0]:0;if(gp.buttons[0]?.pressed||gp.buttons[1]?.pressed)keys.jump=true;else keys.jump=false}}
 player.vx=dir*7;if(dir)lastActivity=Date.now();
 if((keys.jump||keys[" "])&&player.ground)jump();
 player.vy-=25*dt;const oldY=player.y;player.x+=player.vx*dt;player.y+=player.vy*dt;player.ground=false;
 for(const p of platforms){if(player.x+player.w/2>p.x-p.w/2&&player.x-player.w/2<p.x+p.w/2&&oldY>=p.y+p.h/2-.08&&player.y<=p.y+p.h/2&&player.vy<=0){player.y=p.y+p.h/2;player.vy=0;player.ground=true}}
 if(playMode==="group"){for(const p of others.values()){const dx=(p.x||0)-player.x,dy=(p.y||0)-player.y,dist=Math.hypot(dx,dy);if(dist>MAX_ROPE){player.x+=dx/dist*(dist-MAX_ROPE)*.35;if(p.y>player.y+1&&!player.ground)player.vy=Math.max(player.vy,2)}}}
 for(const h of hazards){if(Math.abs(player.x-h.x)<(player.w+h.w)/2&&Math.abs(player.y-h.y)<(player.h+h.h)/2){resetPlayer();toast("Engele çarptın! Son başlangıca döndün.");break}}
 const cp=checkpoints.filter(c=>player.x>=c.x).pop();if(cp&&cp.level>currentLevel){currentLevel=cp.level;$("levelLabel").textContent="SEVİYE "+currentLevel+" / 100";toast("Seviye "+currentLevel+"!")}
 if(player.y< -8){const last=checkpoints.filter(c=>c.level<=currentLevel).pop();player.x=last?last.x-2:2;player.y=last?last.y+2:1;player.vy=0;toast("Düştün! Checkpoint'e döndün.")}
 cameraX=Math.max(0,player.x-7);
}
function roundRect(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function draw(){
 const w=innerWidth,h=innerHeight;ctx.clearRect(0,0,w,h);
 const sky=ctx.createLinearGradient(0,0,0,h);sky.addColorStop(0,"#6db7e8");sky.addColorStop(1,"#d5efff");ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);
 // uzak tepeler
 ctx.fillStyle="#8bc5bd";for(let i=0;i<8;i++){const x=((i*280-cameraX*scale*.18)%(w+300))-100;ctx.beginPath();ctx.arc(x,h*.78,120,Math.PI,0);ctx.fill()}
 const groundY=h*.78,unit=Math.min(w/18,h/9);
 const sx=x=>w*.35+(x-cameraX)*unit,sy=y=>groundY-y*unit;
 ctx.fillStyle="#24435d";ctx.fillRect(0,groundY,w,h-groundY);
 for(const p of platforms){const x=sx(p.x-p.w/2),y=sy(p.y+p.h/2);if(x>w+100||x<-200)continue;roundRect(x,y,p.w*unit,p.h*unit,8,p.cp?"#2879d0":"#149b83");ctx.fillStyle="#ffffff33";ctx.fillRect(x+4,y+3,p.w*unit-8,4)}
 for(const c of checkpoints){const x=sx(c.x);if(x>w+30||x<-30)continue;ctx.fillStyle="#ffd166";ctx.fillRect(x-2,sy(0),4,groundY-sy(0));ctx.fillStyle="#f59e0b";ctx.fillRect(x,sy(3),24,15)}
 for(const z of hazards){const x=sx(z.x-z.w/2),y=sy(z.y+z.h/2);ctx.fillStyle="#e65b45";ctx.beginPath();ctx.moveTo(x,y+z.h*unit);ctx.lineTo(x+z.w*unit/2,y);ctx.lineTo(x+z.w*unit,y+z.h*unit);ctx.fill()}
 // halatlar
 if(playMode==="group")for(const p of others.values()){ctx.strokeStyle="#ffe08a";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(sx(player.x),sy(player.y+player.h*.55));ctx.lineTo(sx(p.x||0),sy((p.y||0)+player.h*.55));ctx.stroke()}
 drawPerson(player.x,player.y,colors[(me?.slot||0)%4],true);
 if(playMode==="group")for(const p of others.values())drawPerson(p.x||0,p.y||0,colors[(p.slot||1)%4],false);
 ctx.fillStyle="#12263b";ctx.font="bold 14px system-ui";ctx.fillText("2D PARKUR",18,30);
}
function drawPerson(x,y,color,self){const unit=Math.min(innerWidth/18,innerHeight/9),px=innerWidth*.35+(x-cameraX)*unit,py=innerHeight*.78-y*unit;ctx.fillStyle="#0003";ctx.beginPath();ctx.ellipse(px,py+4,unit*.34,unit*.09,0,0,Math.PI*2);ctx.fill();roundRect(px-unit*.23,py-unit*.95,unit*.46,unit*.88,unit*.16,color);ctx.fillStyle="#ffd6ad";ctx.beginPath();ctx.arc(px,py-unit*1.08,unit*.2,0,Math.PI*2);ctx.fill();if(self){ctx.fillStyle="#fff";ctx.font="bold 11px system-ui";ctx.textAlign="center";ctx.fillText("SEN",px,py-unit*1.28);ctx.textAlign="left"}}
async function sendState(now){if(!me||!room||!started||now-lastSend<1200)return;lastSend=now;
 if(Date.now()-lastActivity>60000){await db.from("game_players").delete().eq("id",playerId);toast("Hareketsizlik nedeniyle odadan ayrıldın.");started=false;return}
 db.from("game_players").update({x:+player.x.toFixed(2),y:+player.y.toFixed(2),z:0,state:player.y<-.5?"falling":"active",updated_at:new Date().toISOString()}).eq("id",playerId).then(()=>{});
 if(now-lastCleanup>15000){lastCleanup=now;const cutoff=new Date(Date.now()-60000).toISOString();db.from("game_players").delete().eq("room_id",room.id).neq("id",playerId).lt("updated_at",cutoff).then(()=>{})}}
let prev=0;function frame(now){const dt=Math.min(.04,(now-(prev||now))/1000);prev=now;update(dt);draw();sendState(now);requestAnimationFrame(frame)}requestAnimationFrame(frame);
addEventListener("beforeunload",()=>{if(channel)db.removeChannel(channel)});
</script></body></html>
